<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .buttons{
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .sub-button{
      background-color: red;
      padding: 10px 15px ;
      color: white;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .join-button{
      background-color: white;
      padding: 10px 15px ;
      color: black;
      font-size: 15px;
      border: 1px solid black;
      border-radius: 10px;
      cursor: pointer;
    }
    .tweet-button{
      background-color: blue;
      padding: 10px 15px ;
      color: white;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="buttons">
    <button class="sub-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">TWEET</button>
  </div>
</body>
</html>
