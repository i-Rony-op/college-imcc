<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .bootstrap {
        background-color: rgb(121, 82, 179);
        padding: 12px 15px;
        color: white;
        font-size: 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .started {
        background-color: rgb(108, 117, 125);
        padding: 12px 15px;
        color: white;
        font-size: 15px;
        border: 1px solid rgb(121, 82, 179);
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <button class="bootstrap">Get Started</button>
    <button class="started">Download</button>
  </body>
</html>
