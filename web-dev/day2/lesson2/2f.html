<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a {
        color: rgb(0, 113, 133);
      }
      .text1{
        font-size: 30px;
        font-weight: bold;
      }
      .text2{
        color: rgb(0, 118, 0);
      }
      .btn-1{
        background-color: rgb(255, 216, 20);
        padding: 12px 30px;
        color: black;
        font-size: 15px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin-right: 10px;

      }
      .btn-2{
        background-color: rgb(255, 164, 28);
        padding: 12px 25px;
        color: black;
        font-size: 15px;
        border: none;
        border-radius: 20px;
        cursor: pointer;

      }
    </style>
  </head>
  <body>
    <a href="https://www.amazon.in/">Back TO Amazon</a>
    <p class="text1">Nike Black Running Shoes</p>
    <p class="text2">$39 - in stock</p>
    <p>Free Delivery tommorow</p>
    <button class="btn-1">Add to Cart</button>
    <button class="btn-2">Buy now</button>

</html>
