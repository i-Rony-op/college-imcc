<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .linkedin {
        background-color: rgb(10, 102, 194);
        color: white;
        border: none;
        padding: 12px 30px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 20px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.35s;
      }

      .linkedin:hover {
        background-color: rgba(2, 70, 138, 0.907);
      }

      .save {
        background-color: white;
        color: rgb(10, 102, 194);
        border-width: 1px;
        border-style: solid;
        border:1px solid rgb(10, 102, 194);
        padding: 12px 30px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 22px;
        cursor: pointer;
        transition:
          background-color 0.25s,
          border-width 0.25s;
      }
      .save:hover {
        background-color: rgb(226, 240, 254);
        border-width: 5px;
      }
    </style>
  </head>
  <body>
    <button class="linkedin">Apply on company website</button>
    <button class="save">Save</button>
  </body>
</html>
