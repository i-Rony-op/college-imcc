<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a {
        color: rgb(0, 113, 133);
      }

      a:hover {
        color: rgb(199, 81, 31);
      }

      .text1 {
        font-size: 30px;
        font-weight: bold;
      }

      .text2 {
        color: rgb(0, 136, 0);
        font-weight: bold;
      }

      .btn-1 {
        background-color: rgb(249, 217, 76);
        border: none;
        padding: 12px 15px;
        border-radius: 15px;
        margin-right: 8px;
        cursor: pointer;
      }

      .btn-1:hover {
        background-color: rgb(247, 202, 0);
      }

      .btn-1:active {
        opacity: 0.6;
      }

      .btn-2 {
        background-color: rgb(255, 164, 28);
        border: none;
        padding: 12px 15px;
        border-radius: 15px;
        cursor: pointer;
      }

      .btn-2:hover {
        background-color: rgb(250, 137, 0);
      }

      .btn-2:active {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <a href="https://amazon.com"> Back to Amazon </a>
    <p class="text1">Nike Black Running Shoes</p>
    <p class="text2">$39 - in stock.</p>
    <p>Free delivery tomorrow.</p>
    <button class="btn-1">Add to Cart</button>
    <button class="btn-2">Buy now</button>
  </body>
</html>
