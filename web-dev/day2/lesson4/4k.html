<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .buttons {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .stretchyy {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 10px 15px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .stretchyy:hover {
        padding: 10px 30px;
      }
    </style>
  </head>
  <body>
    <div class="buttons">
      <button class="stretchyy">One</button>
      <button class="stretchyy">Two</button>
      <button class="stretchyy">Three</button>
    </div>  
  </body>
</html>
