<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .linknedin {
        background-color: rgb(10, 102, 194);
        color: white;
        border: none;
        padding: 13px 20px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 20px;
        cursor: pointer;
        transition: background-color 0.35s;
      }

      .linknedin:hover {
        background-color: rgb(2, 70, 138);
      }

      .save {
        background-color: white;
        color: rgb(10, 102, 194);
        border: 1px solid rgb(10, 102, 194);
        padding: 13px 26px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 30px;
        margin-left: 10px;
        cursor: pointer;
        transition:
          background-color 0.35s,
          border-width 0.35s,
          padding 0.35s;
      }

      .save:hover {
        background-color: rgb(226, 240, 254);
        border-width: 2px;
        padding: 11px 24px;
      }
    </style>
  </head>
  <body>
    <button class="linknedin">Apply on company website</button>
    <button class="save">Save</button>
  </body>
</html>
