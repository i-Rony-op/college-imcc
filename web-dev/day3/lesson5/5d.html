<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .center {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      p {
        font-family: Arial;
        text-align: center;
      }

      .title {
        font-size: 35px;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .subtitle {
        font-size: 20px;
      }

      .link {
        color: rgb(58, 108, 199);
      }
    </style>
  </head>
  <body>
    <div class="center">
      <p class="title">Shopping for your business?</p>
      <p class="subtitle">See how Apple at Work can help.</p>
      <p class="link">Learn more &#62;</p>
    </div>
  </body>
</html>
